name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  XAHAUD_VERSION: 2026.6.21-release+3350

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: testnet-3
            args: "--type testnet --validators 3 --domain localhost"
            upgrade_to: 2026.9.9-dev+3667
          - name: testnet-1
            args: "--type testnet --validators 1 --domain localhost"
            upgrade_to: 2026.9.9-dev+3667
          - name: standalone
            args: "--type standalone"
          - name: standalone-dev
            args: "--type standalone"
            version: 2026.9.9-dev+3667
    steps:
      - uses: actions/checkout@v7

      # Overlaps the ~30s of image pulls with the setup steps below; `xng
      # start` later finds them present or joins the in-flight pull.
      - name: pre-pull docker images
        run: |
          (docker compose -f traefik/compose.yml pull &&
           docker pull transia/explorer:latest &&
           docker pull node:24-slim &&
           docker pull ubuntu:noble &&
           docker pull nginx:alpine) >/dev/null 2>&1 &

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v6
        with:
          path: ~/.cache/xahau-network-generator
          key: xahaud-${{ matrix.version || env.XAHAUD_VERSION }}

      - uses: actions/cache@v6
        if: matrix.upgrade_to
        with:
          path: ~/.cache/xahau-network-generator
          key: xahaud-${{ matrix.upgrade_to }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

      - run: pnpm xng create --name ${{ matrix.name }} --version "${{ matrix.version || env.XAHAUD_VERSION }}" ${{ matrix.args }}
      - run: pnpm xng start --name ${{ matrix.name }} --wait --timeout 600
      - run: pnpm e2e --name ${{ matrix.name }}
      - run: pnpm xng reset --name ${{ matrix.name }} --wait --timeout 600
      - run: pnpm e2e --name ${{ matrix.name }}

      - name: xng upgrade
        if: matrix.upgrade_to
        run: pnpm xng upgrade --name ${{ matrix.name }} --version "${{ matrix.upgrade_to }}" --timeout 600
      - name: e2e after upgrade
        if: matrix.upgrade_to
        run: pnpm e2e --name ${{ matrix.name }} --expect-version "${{ matrix.upgrade_to }}"

      - name: docker compose logs
        if: failure()
        run: docker compose -f workspace/${{ matrix.name }}/compose.yml logs --tail 200

      - name: stop network
        if: always()
        run: pnpm xng stop --name ${{ matrix.name }}
