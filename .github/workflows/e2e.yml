name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  XAHAUD_VERSION: 2026.10.13-release+4119
  # upgrade target, and the version of the standalone-dev job
  UPGRADE_TO: 2026.10.14-dev+4134

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: testnet-3
            args: "--type testnet --validators 3 --domain localhost"
            upgrade: true
            rotate: "--add 2 --remove v1"
          - name: testnet-1
            args: "--type testnet --validators 1 --domain localhost --root"
            upgrade: true
            rotate: "--add 2"
          - name: standalone
            args: "--type standalone"
          - name: standalone-dev
            args: "--type standalone"
            dev: true
    steps:
      - uses: actions/checkout@v7

      # Overlaps the ~30s of image pulls with the setup steps below; `xng
      # start` later finds them present or joins the in-flight pull.
      - name: pre-pull docker images
        run: |
          (docker compose -f traefik/compose.yml pull &&
           docker pull ghcr.io/tequdev/xrpl-technical-explorer:xahau-devnet &&
           docker pull node:24-slim &&
           docker pull ubuntu:noble &&
           docker pull nginx:alpine) >/dev/null 2>&1 &

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v6
        with:
          path: ~/.cache/xahau-network-generator
          key: xahaud-${{ matrix.dev && env.UPGRADE_TO || env.XAHAUD_VERSION }}

      - uses: actions/cache@v6
        if: matrix.upgrade
        with:
          path: ~/.cache/xahau-network-generator
          key: xahaud-${{ env.UPGRADE_TO }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

      - run: pnpm xng create --name ${{ matrix.name }} --version "${{ matrix.dev && env.UPGRADE_TO || env.XAHAUD_VERSION }}" ${{ matrix.args }}
      - run: pnpm xng start --name ${{ matrix.name }} --wait --timeout 600
      - run: pnpm e2e --name ${{ matrix.name }}
      - run: pnpm xng reset --name ${{ matrix.name }} --wait --timeout 600
      - run: pnpm e2e --name ${{ matrix.name }}

      - name: simulate host reboot (restart the Docker daemon; containers must come back on their own)
        run: pnpm e2e:restart --name ${{ matrix.name }} --timeout 600 -- sudo systemctl restart docker
      - run: pnpm e2e --name ${{ matrix.name }}

      - name: xng upgrade
        if: matrix.upgrade
        run: pnpm xng upgrade --name ${{ matrix.name }} --version "${{ env.UPGRADE_TO }}" --timeout 600
      - name: e2e after upgrade
        if: matrix.upgrade
        run: pnpm e2e --name ${{ matrix.name }} --expect-version "${{ env.UPGRADE_TO }}"

      - name: xng rotate
        if: matrix.upgrade
        run: pnpm xng rotate --name ${{ matrix.name }} --timeout 600 ${{ matrix.rotate }}
      - name: e2e after rotate
        if: matrix.upgrade
        run: pnpm e2e --name ${{ matrix.name }} --expect-version "${{ env.UPGRADE_TO }}"

      - name: docker compose logs
        if: failure()
        run: docker compose -f workspace/${{ matrix.name }}/compose.yml logs --tail 200

      - name: stop network
        if: always()
        run: pnpm xng stop --name ${{ matrix.name }}

  # `xng apply` owns all of workspace/, so it gets its own job on a clean
  # checkout rather than a matrix entry next to hand-made networks.
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: pre-pull docker images
        run: |
          (docker compose -f traefik/compose.yml pull &&
           docker pull ghcr.io/tequdev/xrpl-technical-explorer:xahau-devnet &&
           docker pull node:24-slim &&
           docker pull ubuntu:noble &&
           docker pull nginx:alpine) >/dev/null 2>&1 &

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v6
        with:
          path: ~/.cache/xahau-network-generator
          key: xahaud-${{ env.XAHAUD_VERSION }}

      - uses: actions/cache@v6
        with:
          path: ~/.cache/xahau-network-generator
          key: xahaud-${{ env.UPGRADE_TO }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

      - run: pnpm e2e:apply --version "$XAHAUD_VERSION" --upgrade-to "$UPGRADE_TO" --domain localhost --timeout 600

      - name: docker compose logs
        if: failure()
        run: docker compose -f workspace/apply1/compose.yml logs --tail 200

      - name: remove networks
        if: always()
        run: |
          echo 'networks: {}' > "$RUNNER_TEMP/empty.yml"
          pnpm xng apply -y -f "$RUNNER_TEMP/empty.yml"

  # Runs the unit tests with the real `cf` installed, so the auth-free
  # --dry-run contract test in src/cloudflare.test.ts is never skipped. The
  # live e2e (orders and deletes one real certificate pack on the zone) only
  # runs when the secret and variable are set, so forks and PRs skip it.
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      XNG_CF_ZONE: ${{ vars.XNG_CF_ZONE }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Keep in sync with CF_VERSION in src/cloudflare.ts.
      - run: npm i -g cf@0.15.0
      - run: pnpm test
      - run: pnpm e2e:cf
        if: env.CLOUDFLARE_API_TOKEN != '' && env.XNG_CF_ZONE != ''
