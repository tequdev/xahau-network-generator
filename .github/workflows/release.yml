# Two npm publishers in one file, because npm allows a single trusted publisher (workflow file)
# per package:
# - release (manual): tags package.json's version as v<version>, publishes it to npm as `latest`
#   and creates a GitHub release with generated notes. Defaults to a dry run (nothing tagged,
#   released or published).
# - dev (automatic): after e2e succeeds on main, publishes that commit as
#   0.0.0-dev.<run>.g<sha> under the `dev` dist-tag (`npm i xahau-network-generator@dev`).
name: Release
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no tag, no release, npm publish --dry-run)"
        type: boolean
        default: true
  workflow_run:
    workflows: [e2e]
    types: [completed]
    branches: [main]
permissions:
  contents: write # tag + release
  id-token: write # npm provenance / OIDC
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # npm >= 11.5 for OIDC publishing
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - id: v
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: git fetch --tags && ! git rev-parse -q --verify "refs/tags/${{ steps.v.outputs.tag }}" # version must be unreleased
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec tsc --noEmit
      - name: Packed-install smoke test
        run: |
          npm pack # prepack builds dist/
          dir="$(mktemp -d)"
          cp xahau-network-generator-*.tgz "$dir/pkg.tgz"
          cd "$dir"
          npm init -y > /dev/null
          npm i ./pkg.tgz
          ./node_modules/.bin/xng --help
          ./node_modules/.bin/xng doctor --help
          test -f node_modules/xahau-network-generator/faucet/npm-shrinkwrap.json && test -f node_modules/xahau-network-generator/debugstream/npm-shrinkwrap.json
      - run: |
          if [ -n "$(npm view "xahau-network-generator@${TAG#v}" version 2>/dev/null)" ]; then echo "already published"
          else npm publish --provenance --access public ${{ inputs.dry_run && '--dry-run' || '' }}; fi
        env:
          TAG: ${{ steps.v.outputs.tag }}
          # NPM_TOKEN when set (needed for the first publish, before a trusted publisher can exist); otherwise keep
          # setup-node's placeholder so OIDC is used (an empty token has been reported to break OIDC).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || env.NODE_AUTH_TOKEN }}
      - if: ${{ !inputs.dry_run }}
        run: gh release create "${{ steps.v.outputs.tag }}" --target "$GITHUB_SHA" --generate-notes # also creates the tag
        env:
          GH_TOKEN: ${{ github.token }}

  dev:
    # Only a push to this repo's main (the `branches` filter above matches a fork PR whose head
    # branch is also called main), and only while that commit is still the tip of main: for
    # workflow_run events the provenance's sha claim is github.sha (= current main), not head_sha,
    # so a later push would be attested instead of the commit actually built. The later push's own
    # e2e run publishes it.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    concurrency: npm-dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 0.0.0-… sorts below every real release, so dev builds never satisfy a ^x.y.z range and
      # package.json's version stays the one `release` last published. Not committed anywhere.
      - run: npm version --no-git-tag-version "0.0.0-dev.${GITHUB_RUN_NUMBER}.g${SHA::7}"
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
      - run: npm publish --provenance --access public --tag dev # prepack builds dist/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || env.NODE_AUTH_TOKEN }}
