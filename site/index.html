<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xahau Devnets</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23197a4b'/%3E%3Cpath d='M9 9l14 14M23 9L9 23' stroke='white' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&family=Noto+Sans+Mono&display=swap">
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--color-neutral-solid-gray-900);font:400 var(--font-size-16)/1.7 'Noto Sans',-apple-system,BlinkMacSystemFont,sans-serif}
a{color:var(--color-primitive-green-800)}
a:hover{color:var(--color-primitive-green-900)}
:focus-visible{outline:2px solid var(--color-primitive-yellow-600);outline-offset:2px}
.mono{font-family:'Noto Sans Mono',var(--font-family-mono);font-size:var(--font-size-14);overflow-wrap:anywhere}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
header{background:var(--color-primitive-green-50);border-bottom:2px solid var(--color-primitive-green-800)}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 24px;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:var(--font-size-20)}
.brand svg{width:32px;height:32px}
.brand span{font-weight:400;font-size:var(--font-size-14);color:var(--color-neutral-solid-gray-600)}
nav{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:var(--font-size-14)}
h1{font-size:var(--font-size-32);font-weight:700;line-height:1.5;margin:32px 0 8px}
.intro{margin:0 0 24px}
.card{background:#fff;box-shadow:var(--elevation-1);border-radius:var(--border-radius-8);padding:20px;margin-bottom:24px}
.card-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding-bottom:12px;border-bottom:1px solid var(--color-neutral-solid-gray-200)}
h2{font-size:var(--font-size-20);font-weight:700;line-height:1.5;margin:0}
.host{color:var(--color-neutral-solid-gray-600);flex:1}
.chip{font-size:var(--font-size-14);font-weight:700;line-height:1.5;padding:0 12px;border-radius:999px;border:1px solid var(--color-neutral-solid-gray-600);color:var(--color-neutral-solid-gray-600);background:#fff}
.chip.ok{border-color:var(--color-semantic-success-1);color:var(--color-semantic-success-1);background:var(--color-primitive-green-50)}
.chip.warn{border-color:var(--color-primitive-yellow-800);color:var(--color-primitive-yellow-800);background:var(--color-primitive-yellow-50)}
h3{font-size:var(--font-size-16);font-weight:700;margin:20px 0 4px}
dl{margin:0}
.row{display:grid;grid-template-columns:160px 1fr;gap:4px 16px;align-items:center;padding:6px 0;border-bottom:1px solid var(--color-neutral-solid-gray-200)}
.row:last-child{border-bottom:0}
dt{font-size:var(--font-size-14);color:var(--color-neutral-solid-gray-600)}
dd{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;min-width:0}
.btn{font:700 var(--font-size-14)/1.5 'Noto Sans',sans-serif;cursor:pointer;border-radius:var(--border-radius-8);border:2px solid var(--color-primitive-green-800);background:var(--color-primitive-green-800);color:#fff;padding:0 20px;min-height:44px}
.btn:hover{background:var(--color-primitive-green-900);border-color:var(--color-primitive-green-900)}
.btn:disabled{background:var(--color-neutral-solid-gray-600);border-color:var(--color-neutral-solid-gray-600);cursor:wait}
.btn.copy{background:#fff;color:var(--color-primitive-green-800);min-height:32px;padding:0 12px;border-width:1px}
.btn.copy:hover{background:var(--color-primitive-green-50)}
form{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
label{font-size:var(--font-size-14);font-weight:700}
input{font:inherit;width:100%;max-width:480px;min-height:44px;padding:0 12px;border:1px solid var(--color-neutral-solid-gray-600);border-radius:var(--border-radius-8)}
.banner{margin:12px 0 0;padding:12px 16px;border:2px solid var(--color-semantic-error-1);border-radius:var(--border-radius-8);background:var(--color-primitive-red-50);color:var(--color-semantic-error-1);font-weight:700}
.secret{margin:8px 0;padding:12px 16px;border:2px solid var(--color-primitive-yellow-800);border-radius:var(--border-radius-8);background:var(--color-primitive-yellow-50)}
.secret p{margin:4px 0 0;font-size:var(--font-size-14)}
.result{margin-top:12px}
footer{border-top:1px solid var(--color-neutral-solid-gray-200);padding:16px 0 32px;font-size:var(--font-size-14);color:var(--color-neutral-solid-gray-600)}
@media(max-width:480px){.row{grid-template-columns:1fr;gap:0}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" style="fill:var(--color-primitive-green-800)"/><path d="M9 9l14 14M23 9L9 23" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></svg>Xahau Devnets <span id="domain"></span></div>
  <nav aria-label="Links">
    <a href="https://docs.xahau.network/">Docs</a>
    <a href="https://github.com/xahau">Xahau on GitHub</a>
    <a href="https://github.com/tequdev/xahau-network-generator">xahau-network-generator</a>
  </nav>
</div></header>
<main class="wrap">
  <h1>Networks</h1>
  <p class="intro">Disposable Xahau networks, one per xahaud build or feature branch. Ledgers can be reset at any time, and XAH here has no value.</p>
  <div id="networks"></div>
</main>
<footer><div class="wrap">Generated by <a href="https://github.com/tequdev/xahau-network-generator">xahau-network-generator</a> · <a href="https://xahau.network/">xahau.network</a></div></footer>
<script>
const $ = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
const host = u => u.replace(/^[a-z]+:\/\//, '');

function copyBtn(text) {
  const b = $('button', { type: 'button', className: 'btn copy', textContent: 'Copy' });
  b.setAttribute('aria-label', 'Copy ' + text);
  b.onclick = async () => {
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch {
      // navigator.clipboard needs a secure context; plain-http devnets get the legacy path.
      const t = document.body.appendChild($('textarea', { value: text, style: 'position:fixed;opacity:0' }));
      t.select(); try { ok = document.execCommand('copy'); } catch {} t.remove();
    }
    b.textContent = ok ? 'Copied' : 'Copy failed'; setTimeout(() => (b.textContent = 'Copy'), 1500);
  };
  return b;
}
const row = (label, ...val) => $('div', { className: 'row' }, $('dt', { textContent: label }), $('dd', {}, ...val));
const mono = t => $('span', { className: 'mono', textContent: t });
const copyRow = (label, text, link) => row(label, link ? $('a', { href: text, target: '_blank', rel: 'noopener', className: 'mono', textContent: text }) : mono(text), copyBtn(text));

function live(url, set) {
  let delay = 5000, timer;
  const connect = () => {
    const ws = new WebSocket(url);
    const info = () => ws.readyState === 1 && ws.send(JSON.stringify({ id: 'info', command: 'server_info' }));
    ws.onopen = () => {
      delay = 5000; info();
      ws.send(JSON.stringify({ id: 'sub', command: 'subscribe', streams: ['ledger'] }));
      timer = setInterval(info, 30000);
    };
    ws.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.id === 'info' && m.result?.info) {
        const i = m.result.info;
        set({ version: i.build_version, state: i.server_state, peers: i.peers, ledger: i.validated_ledger?.seq });
      } else if (m.type === 'ledgerClosed') set({ ledger: m.ledger_index });
    };
    ws.onclose = () => { clearInterval(timer); set({ state: null }); setTimeout(connect, delay); delay = Math.min(delay * 2, 60000); };
    ws.onerror = () => ws.close();
  };
  connect();
}

function accountBlock(a, explorer, balance, hash) {
  const box = $('div', { className: 'result' }, $('dl', {},
    row('Address', $('a', { href: `${explorer}/account/${a.address}`, target: '_blank', rel: 'noopener', className: 'mono', textContent: a.address }), copyBtn(a.address))));
  const dl = box.firstChild;
  if (a.secret) dl.append(row('Secret', $('div', { className: 'secret' }, mono(a.secret), $('p', { textContent: 'Shown once. Store it; the faucet does not keep it.' })), copyBtn(a.secret)));
  if (balance != null) dl.append(row('Balance', mono(`${balance} XAH`)));
  if (hash) dl.append(row('Transaction', $('a', { href: `${explorer}/tx/${hash}`, target: '_blank', rel: 'noopener', className: 'mono', textContent: hash })));
  return box;
}

function faucet(ep) {
  const out = $('div', { ariaLive: 'polite' });
  const input = $('input', { id: 'dest-' + ep.id, type: 'text', placeholder: 'r…', autocomplete: 'off', spellcheck: false });
  const btn = $('button', { type: 'submit', className: 'btn', textContent: 'Get devnet funds' });
  const form = $('form', {}, $('label', { htmlFor: input.id, textContent: 'Destination address (optional)' }), input, btn);
  form.onsubmit = async ev => {
    ev.preventDefault();
    btn.disabled = true; btn.textContent = 'Requesting…'; out.replaceChildren();
    const fail = (msg, body) => {
      out.append($('div', { className: 'banner', role: 'alert', textContent: msg }));
      if (body?.account?.secret) out.append(accountBlock(body.account, ep.explorer));
    };
    try {
      const dest = input.value.trim();
      const r = await fetch(`${ep.faucet}/accounts`, { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify(dest ? { destination: dest } : {}), signal: AbortSignal.timeout(60000) });
      const body = await r.json().catch(() => ({}));
      if (r.ok) out.append(accountBlock(body.account ?? {}, ep.explorer, body.balance, body.hash));
      else fail(body.error || 'Faucet request failed. Try again later.', body);
    } catch { fail('Faucet request failed. Try again later.'); }
    btn.disabled = false; btn.textContent = 'Get devnet funds';
  };
  return $('div', {}, form, out);
}

function card(n, i) {
  const ep = { ...n.endpoints, id: i };
  const chip = $('span', { className: 'chip', textContent: 'connecting…', ariaLive: 'polite' });
  const v = Object.fromEntries(['ledger', 'state', 'version', 'peers'].map(k => [k, mono('—')]));
  const status = $('dl', {}, row('Ledger index', v.ledger), row('Server state', v.state), row('Version', v.version), row('Peers', v.peers));
  const ends = $('dl', {}, copyRow('WebSocket', ep.ws), copyRow('JSON-RPC', ep.rpc), copyRow('Explorer', ep.explorer, true), copyRow('Validator list', ep.vl));
  if (ep.pwa) ends.append(copyRow('App loader', ep.pwa));
  live(ep.ws, d => {
    for (const k of ['ledger', 'version', 'peers']) if (d[k] != null) v[k].textContent = d[k];
    if (d.state === null) { chip.textContent = 'offline'; chip.className = 'chip'; }
    else if (d.state) { v.state.textContent = d.state; chip.textContent = d.state === 'full' ? 'full' : 'syncing'; chip.className = 'chip ' + (d.state === 'full' ? 'ok' : 'warn'); }
  });
  return $('section', { className: 'card' },
    $('div', { className: 'card-head' }, $('h2', { textContent: n.root ? 'main' : n.name }), $('span', { className: 'host mono', textContent: host(ep.ws) }), chip),
    $('h3', { textContent: 'Status' }), status,
    $('h3', { textContent: 'Endpoints' }), ends,
    $('h3', { textContent: 'Faucet' }), faucet(ep));
}

fetch('networks.json').then(r => r.ok ? r.json() : Promise.reject(r.status)).then(d => {
  document.getElementById('domain').textContent = d.domain;
  document.getElementById('networks').append(...d.networks.map(card));
}).catch(() => document.getElementById('networks').append($('div', { className: 'banner', role: 'alert', textContent: 'Could not load the network list.' })));
</script>
</body>
</html>
