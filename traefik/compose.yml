name: traefik
services:
  traefik:
    image: traefik:v3.6.11
    restart: always
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # TLS/ACME: see compose.acme.yml (applied when XNG_ACME_EMAIL is set).
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/acme
    networks:
      - proxy

volumes:
  acme:

networks:
  proxy:
    external: true
